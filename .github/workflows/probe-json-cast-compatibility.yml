name: Probe - JSON CAST compatibility (temporary investigation)

# One-off, throwaway investigation for the 2026-09-16 migration-compatibility
# incident: apps/api/prisma/migrations/20260723003000_launcher_integration
# uses `CAST(0 AS JSON)`, which MariaDB rejects (error 1064) but MySQL 8
# accepts. This workflow proves, against real database engines (never the
# real migration file, never any real table), whether the candidate
# replacement -- the literal `'0'` -- is a safe, semantically-identical,
# cross-engine fix. See docs/decisions/0030-migration-casing-static-audit.md
# and the linux-mariadb-migration job's real failure (run 35131778604) for
# the full incident context. This file is intentionally scoped to trigger
# only on changes to itself -- it is not part of the permanent CI pipeline.

on:
  push:
    paths:
      - '.github/workflows/probe-json-cast-compatibility.yml'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  mariadb11-probe:
    name: "MariaDB 11 -- CAST(0 AS JSON) vs literal '0'"
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_DATABASE: bloodmoon_ci
          MARIADB_USER: bloodmoon_ci
          MARIADB_PASSWORD: bloodmoon_ci_pw
          MARIADB_ROOT_PASSWORD: bloodmoon_ci_root_pw
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=12
    steps:
      - name: Install MariaDB client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq mariadb-client

      # Throwaway table, never the real SiteSetting table or real migration.
      - name: Create probe table
        run: |
          set -euo pipefail
          MYSQL="mariadb -h127.0.0.1 -ubloodmoon_ci -pbloodmoon_ci_pw bloodmoon_ci"
          $MYSQL -e "CREATE TABLE JsonCastProbe (id INT PRIMARY KEY AUTO_INCREMENT, label VARCHAR(50), value JSON);"

      - name: Original syntax MUST FAIL on MariaDB -- CAST(0 AS JSON)
        run: |
          set -euo pipefail
          MYSQL="mariadb -h127.0.0.1 -ubloodmoon_ci -pbloodmoon_ci_pw bloodmoon_ci"
          if $MYSQL -e "INSERT INTO JsonCastProbe (label, value) VALUES ('original', CAST(0 AS JSON));" 2>/tmp/original.err; then
            echo "UNEXPECTED: CAST(0 AS JSON) succeeded on MariaDB 11 -- contradicts the real CI failure (run 35131778604) and the premise of this probe."
            exit 1
          fi
          echo "Confirmed: CAST(0 AS JSON) fails on MariaDB 11, as expected:"
          cat /tmp/original.err
          grep -qi "1064\|syntax" /tmp/original.err

      - name: Candidate syntax MUST PASS on MariaDB -- '0'
        run: |
          set -euo pipefail
          MYSQL="mariadb -h127.0.0.1 -ubloodmoon_ci -pbloodmoon_ci_pw bloodmoon_ci"
          $MYSQL -e "INSERT INTO JsonCastProbe (label, value) VALUES ('candidate', '0');"
          echo "Confirmed: '0' inserts successfully on MariaDB 11."

      - name: Verify the candidate's stored value is semantically a valid JSON 0
        run: |
          set -euo pipefail
          MYSQL="mariadb -h127.0.0.1 -ubloodmoon_ci -pbloodmoon_ci_pw bloodmoon_ci -N -B"
          VALID=$($MYSQL -e "SELECT JSON_VALID(value) FROM JsonCastProbe WHERE label='candidate';")
          TYPE=$($MYSQL -e "SELECT JSON_TYPE(value) FROM JsonCastProbe WHERE label='candidate';")
          RAW=$($MYSQL -e "SELECT value FROM JsonCastProbe WHERE label='candidate';")
          echo "JSON_VALID=$VALID JSON_TYPE=$TYPE RAW=$RAW"
          if [ "$VALID" != "1" ]; then echo "FAIL: stored value is not valid JSON"; exit 1; fi
          if [ "$TYPE" != "INTEGER" ]; then echo "FAIL: stored JSON_TYPE is '$TYPE', expected INTEGER"; exit 1; fi
          if [ "$RAW" != "0" ]; then echo "FAIL: stored raw JSON text is '$RAW', expected 0"; exit 1; fi
          echo "Confirmed: '0' stores as a semantically valid JSON integer 0 on MariaDB 11."

      - name: Drop probe table
        if: always()
        run: |
          MYSQL="mariadb -h127.0.0.1 -ubloodmoon_ci -pbloodmoon_ci_pw bloodmoon_ci"
          $MYSQL -e "DROP TABLE IF EXISTS JsonCastProbe;"

  mysql8-probe:
    name: "MySQL 8 -- confirm candidate '0' stays compatible"
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_DATABASE: bloodmoon_ci
          MYSQL_USER: bloodmoon_ci
          MYSQL_PASSWORD: bloodmoon_ci_pw
          MYSQL_ROOT_PASSWORD: bloodmoon_ci_root_pw
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h127.0.0.1 -uroot -pbloodmoon_ci_root_pw"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=12
    steps:
      - name: Install MySQL client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq mysql-client

      - name: Create probe table
        run: |
          set -euo pipefail
          MYSQL="mysql -h127.0.0.1 -ubloodmoon_ci -pbloodmoon_ci_pw bloodmoon_ci"
          $MYSQL -e "CREATE TABLE JsonCastProbe (id INT PRIMARY KEY AUTO_INCREMENT, label VARCHAR(50), value JSON);"

      # Establishes the baseline this whole incident rests on: MySQL 8 DOES
      # accept the original syntax, which is exactly why this was never
      # caught until a MariaDB-specific CI run existed.
      - name: Original syntax MUST PASS on MySQL 8 -- CAST(0 AS JSON)
        run: |
          set -euo pipefail
          MYSQL="mysql -h127.0.0.1 -ubloodmoon_ci -pbloodmoon_ci_pw bloodmoon_ci"
          $MYSQL -e "INSERT INTO JsonCastProbe (label, value) VALUES ('original', CAST(0 AS JSON));"
          echo "Confirmed: CAST(0 AS JSON) succeeds on MySQL 8, as expected."

      - name: Candidate syntax MUST ALSO PASS on MySQL 8 -- '0'
        run: |
          set -euo pipefail
          MYSQL="mysql -h127.0.0.1 -ubloodmoon_ci -pbloodmoon_ci_pw bloodmoon_ci"
          $MYSQL -e "INSERT INTO JsonCastProbe (label, value) VALUES ('candidate', '0');"
          echo "Confirmed: '0' also inserts successfully on MySQL 8 -- candidate fix does not break MySQL compatibility."

      - name: Verify original and candidate produce identical stored JSON on MySQL 8
        run: |
          set -euo pipefail
          MYSQL="mysql -h127.0.0.1 -ubloodmoon_ci -pbloodmoon_ci_pw bloodmoon_ci -N -B"
          for LABEL in original candidate; do
            VALID=$($MYSQL -e "SELECT JSON_VALID(value) FROM JsonCastProbe WHERE label='$LABEL';")
            TYPE=$($MYSQL -e "SELECT JSON_TYPE(value) FROM JsonCastProbe WHERE label='$LABEL';")
            RAW=$($MYSQL -e "SELECT value FROM JsonCastProbe WHERE label='$LABEL';")
            echo "$LABEL: JSON_VALID=$VALID JSON_TYPE=$TYPE RAW=$RAW"
            if [ "$VALID" != "1" ]; then echo "FAIL: $LABEL value is not valid JSON on MySQL 8"; exit 1; fi
            if [ "$TYPE" != "INTEGER" ]; then echo "FAIL: $LABEL JSON_TYPE is '$TYPE' on MySQL 8, expected INTEGER"; exit 1; fi
            if [ "$RAW" != "0" ]; then echo "FAIL: $LABEL raw JSON text is '$RAW' on MySQL 8, expected 0"; exit 1; fi
          done
          echo "Confirmed: original and candidate syntax produce IDENTICAL stored JSON on MySQL 8 -- '0' is a safe drop-in replacement."

      - name: Drop probe table
        if: always()
        run: |
          MYSQL="mysql -h127.0.0.1 -ubloodmoon_ci -pbloodmoon_ci_pw bloodmoon_ci"
          $MYSQL -e "DROP TABLE IF EXISTS JsonCastProbe;"
