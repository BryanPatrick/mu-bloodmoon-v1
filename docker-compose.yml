services:
  mysql:
    image: mariadb:11
    container_name: bloodmoon-mysql
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: bloodmoon_portal
      MARIADB_USER: bloodmoon
      MARIADB_PASSWORD: bloodmoon
      MARIADB_ROOT_PASSWORD: bloodmoon_root
    ports:
      - "53306:3306"
    volumes:
      - bloodmoon_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h localhost -ubloodmoon -pbloodmoon --silent"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: bloodmoon-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "56379:6379"
    volumes:
      - bloodmoon_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  bloodmoon_mysql_data:
  bloodmoon_redis_data:
