services:
  postgres:
    image: postgres:16-alpine
    container_name: bloodmoon-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: bloodmoon
      POSTGRES_PASSWORD: bloodmoon
      POSTGRES_DB: bloodmoon_portal
    ports:
      - "55432:5432"
    volumes:
      - bloodmoon_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bloodmoon -d bloodmoon_portal"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: bloodmoon-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "56379:6379"
    volumes:
      - bloodmoon_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  bloodmoon_postgres_data:
  bloodmoon_redis_data:
