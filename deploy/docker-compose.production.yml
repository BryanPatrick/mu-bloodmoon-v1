services:
  mysql:
    image: mariadb:11
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      MARIADB_DATABASE: ${MYSQL_DATABASE}
      MARIADB_USER: ${MYSQL_USER}
      MARIADB_PASSWORD: ${MYSQL_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-troque-esta-senha-root}
    volumes:
      - bloodmoon_mysql_data:/var/lib/mysql
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h localhost -u$$MARIADB_USER -p$$MARIADB_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - bloodmoon_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    image: node:22-alpine
    restart: unless-stopped
    working_dir: /app
    env_file:
      - .env.production
    volumes:
      - ../:/app
      - bloodmoon_node_modules:/app/node_modules
    command: sh -c "npm ci && npx prisma generate --schema apps/api/prisma/schema.prisma && npx prisma db push --schema apps/api/prisma/schema.prisma && npm run api:build && npm --workspace @blood-moon/api run start"
    ports:
      - "127.0.0.1:3333:3333"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    image: node:22-alpine
    restart: unless-stopped
    working_dir: /app
    env_file:
      - .env.production
    environment:
      NUXT_PUBLIC_API_BASE: ${NUXT_PUBLIC_API_BASE}
    volumes:
      - ../:/app
      - bloodmoon_node_modules:/app/node_modules
    command: sh -c "npm ci && npm run web:build && node apps/web/.output/server/index.mjs"
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - api

  game-bridge-worker:
    image: node:22-alpine
    restart: unless-stopped
    working_dir: /app
    env_file:
      - .env.production
    volumes:
      - ../:/app
      - bloodmoon_node_modules:/app/node_modules
    command: sh -c "npm ci && npx prisma generate --schema apps/api/prisma/schema.prisma && while true; do npm --workspace @blood-moon/api run worker:game-bridge; sleep 10; done"
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  bloodmoon_mysql_data:
  bloodmoon_redis_data:
  bloodmoon_node_modules:
