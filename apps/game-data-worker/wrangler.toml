# Blood Moon Game Data Worker -- Game Data Platform Phase 1.
# Secrets (AGENT_SECRETS_JSON, API_READ_SECRETS_JSON) are never set here --
# `wrangler secret put <NAME>` only, matching this repo's existing
# never-commit-real-values convention (see deploy/.env.production.example).
name = "bloodmoon-game-data-worker"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "bloodmoon-game-data"
# Real D1 database, provisioned 2026-08-20 (Phase 2D) in the same
# Cloudflare account as the unrelated ai-knowledge-hub-db -- a distinct,
# separate database, never shared/reused. See
# docs/game-data/cloudflare-resources.md.
database_id = "cf84e6fe-7ea6-4f0b-a2f2-313ec3c0dab6"
migrations_dir = "db/migrations"

[[queues.producers]]
binding = "GAME_COMMANDS"
queue = "bloodmoon-production-game-commands"

[[queues.consumers]]
queue = "bloodmoon-production-game-commands"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 5
dead_letter_queue = "bloodmoon-production-game-commands-dlq"

[triggers]
crons = ["17 4 * * *"]
